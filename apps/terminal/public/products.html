<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wave Capital — Products</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: flex-start; gap: 0; padding: 20px 48px; background: rgba(0,0,0,0.9); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo-text { font-size: 14px; font-weight: 800; letter-spacing: 3px; color: #fff; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; padding-left: 12px; }
    .nav-links a { font-size: 13px; font-weight: 500; color: #888; text-decoration: none; letter-spacing: 1px; text-transform: uppercase; }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .nav-links a.nav-cta { color: #4a9eff; border: 1px solid rgba(74,158,255,0.3); padding: 8px 20px; border-radius: 4px; }
    .nav-lang { font-size: 12px; color: #888; cursor: pointer; margin-left: auto; padding: 6px 10px; }
    .nav-lang:hover { color: #fff; }
    .page { padding: 140px 80px 80px; max-width: 1100px; margin: 0 auto; }
    .page-tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #4a9eff; margin-bottom: 16px; }
    .page-title { font-size: 48px; font-weight: 900; letter-spacing: -1px; margin-bottom: 12px; }
    .page-sub { font-size: 15px; color: #888; margin-bottom: 60px; }
    .coming { text-align: center; padding: 100px 0; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; }
    .coming-icon { font-size: 48px; margin-bottom: 20px; }
    .coming h3 { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .coming p { font-size: 14px; color: #888; }
    footer { border-top: 1px solid rgba(255,255,255,0.05); padding: 32px 80px; display: flex; justify-content: space-between; align-items: center; margin-top: 80px; }
    .footer-copy { font-size: 11px; color: rgba(255,255,255,0.15); letter-spacing: 1px; }
    .footer-links { display: flex; gap: 24px; list-style: none; }
    .footer-links a { font-size: 11px; color: rgba(255,255,255,0.25); text-decoration: none; letter-spacing: 1px; text-transform: uppercase; }
    html[dir="rtl"] .nav-links { padding-left: 0; padding-right: 12px; }
    html[dir="rtl"] .nav-lang { margin-left: 0; margin-right: auto; }
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-logo">
    <svg width="28" height="18" viewBox="0 0 80 30" fill="none"><path d="M0 20 C10 10, 20 10, 30 20 C40 30, 50 30, 60 20 C70 10, 80 10, 90 20" stroke="#4a9eff" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
    <span class="nav-logo-text">Wave Capital</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html" data-i18n="nav.home">Home</a></li>
    <li><a href="terminal.html" data-i18n="nav.terminal">Terminal</a></li>
    <li><a href="blog.html" data-i18n="nav.blog">Blog</a></li>
    <li><a href="products.html" class="active" data-i18n="nav.products">Products</a></li>
    <li><a href="terminal.html" class="nav-cta" data-i18n="nav.enter">Enter Terminal</a></li>
  </ul>
  <div class="nav-lang" onclick="cycleLang()" role="button" tabindex="0" onkeydown="if(event.key==='Enter')cycleLang()">🌐 EN</div>
</nav>
<div class="page">
  <div class="page-tag" data-i18n="products.tag">Tools & Systems</div>
  <h1 class="page-title" data-i18n="products.title">Products</h1>
  <p class="page-sub" data-i18n="products.sub">Quantitative tools built for serious traders.</p>
  <div class="coming">
    <div class="coming-icon">🚀</div>
    <h3 data-i18n="products.soon">Coming Soon</h3>
    <p data-i18n="products.soonSub">Backtest Suite, Strategy Analyzer, and more — in development.</p>
  </div>
</div>
<footer>
  <span class="footer-copy">© 2026 Wave Capital</span>
  <ul class="footer-links">
    <li><a href="index.html" data-i18n="nav.home">Home</a></li>
    <li><a href="terminal.html" data-i18n="nav.terminal">Terminal</a></li>
    <li><a href="blog.html" data-i18n="nav.blog">Blog</a></li>
  </ul>
</footer>
<script src="i18n.js"></script>
</body>
</html>
