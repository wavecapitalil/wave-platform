  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: flex-start; gap: 0; padding: 20px 48px; background: rgba(0,0,0,0.9); border-bottom: 1px solid rgba(255,255,255,0.05); }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo-text { font-size: 14px; font-weight: 800; letter-spacing: 3px; color: #fff; text-transform: uppercase; }
    .nav-links { display: flex; align-items: center; gap: 4px; list-style: none; padding-left: 12px; }
    .nav-links a { font-size: 13px; font-weight: 500; color: #888; text-decoration: none; letter-spacing: 1px; text-transform: uppercase; }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .nav-links a.nav-cta { color: #4a9eff; border: 1px solid rgba(74,158,255,0.3); padding: 8px 20px; border-radius: 4px; }
    .nav-lang { font-size: 12px; color: #888; cursor: pointer; margin-left: auto; padding: 6px 10px; }
    .nav-lang:hover { color: #fff; }
    .page { padding: 140px 80px 80px; max-width: 1200px; margin: 0 auto; }
    .page-tag { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: #4a9eff; margin-bottom: 16px; }
    .page-title { font-size: 48px; font-weight: 900; letter-spacing: -1px; margin-bottom: 12px; }
    .page-sub { font-size: 15px; color: #888; margin-bottom: 48px; }

    .empty { text-align: center; padding: 100px 0; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; color: #888; font-size: 14px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .card { display: block; text-decoration: none; color: inherit; border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; overflow: hidden; background: #0a0a0a; transition: border-color .2s, transform .2s; cursor: pointer; }
    .card:hover { border-color: rgba(74,158,255,0.35); transform: translateY(-2px); }
    .card-img { width: 100%; height: 170px; object-fit: cover; display: block; background: #111; }
    .card-body { padding: 18px 20px 22px; }
    .card-cat { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #4a9eff; margin-bottom: 10px; }
    .card-title { font-size: 17px; font-weight: 700; line-height: 1.35; margin-bottom: 10px; }
    .card-lead { font-size: 13px; color: #999; line-height: 1.5; margin-bottom: 14px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-meta { font-size: 11px; color: #555; letter-spacing: .5px; }

    .loadmore-wrap { text-align: center; margin-top: 40px; }
    .loadmore { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #ccc; font-size: 13px; padding: 12px 28px; border-radius: 6px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }
    .loadmore:hover { border-color: #4a9eff; color: #4a9eff; }
    .loadmore:disabled { opacity: .4; cursor: default; }

    /* Article detail */
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #888; text-decoration: none; margin-bottom: 28px; letter-spacing: .5px; text-transform: uppercase; }
    .back-link:hover { color: #4a9eff; }
    .article-hero { width: 100%; height: 420px; object-fit: cover; border-radius: 12px; display: block; margin-bottom: 32px; background: #111; }
    .article-cat { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #4a9eff; margin-bottom: 16px; }
    .article-title { font-size: 38px; font-weight: 900; line-height: 1.2; margin-bottom: 18px; max-width: 820px; }
    .article-meta { font-size: 13px; color: #666; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
    .article-save { margin: 0 0 28px; background: rgba(85,170,255,.07); border: 1px solid rgba(85,170,255,.28); color: #9bd1ff; border-radius: 9px; padding: 9px 13px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .article-save:hover { background: rgba(85,170,255,.13); border-color: #55aaff; }
    .article-lead { font-size: 19px; color: #ccc; line-height: 1.6; margin-bottom: 28px; max-width: 720px; font-weight: 500; }
    .article-body { font-size: 16px; line-height: 1.85; color: #ddd; max-width: 720px; }
    .article-body { white-space: pre-line; }
    .sources-card {margin:24px 0;padding:24px;border:1px solid #263448;border-radius:12px;} .sources-body{white-space:pre-wrap;line-height:1.8;color:#bbb;} .sources-links{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;} .sources-links a{color:#4a9eff;}
    .article-body h3 { font-size: 20px; margin: 28px 0 12px; color: #fff; }
    .article-body p { margin-bottom: 18px; }
    .article-source { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); font-size: 13px; color: #666; max-width: 720px; }
    .article-source a { color: #4a9eff; text-decoration: none; }

    footer { border-top: 1px solid rgba(255,255,255,0.05); padding: 32px 80px; display: flex; justify-content: space-between; align-items: center; margin-top: 80px; }
    .footer-copy { font-size: 11px; color: rgba(255,255,255,0.15); letter-spacing: 1px; }
    .footer-links { display: flex; gap: 24px; list-style: none; }
    .footer-links a { font-size: 11px; color: rgba(255,255,255,0.25); text-decoration: none; letter-spacing: 1px; text-transform: uppercase; }

    html[dir="rtl"] .nav-links { padding-left: 0; padding-right: 12px; }
    html[dir="rtl"] .nav-lang { margin-left: 0; margin-right: auto; }
    html[dir="rtl"] .back-link { flex-direction: row-reverse; }
    /* phones (13/10, yogiweb): the nav used to run off the screen; logo + language on top, links in a centred row below */
    @media (max-width: 760px) {
      .nav { flex-wrap: wrap; row-gap: 8px; padding: 12px 16px 10px; }
      .nav-links { order: 5; width: 100%; flex-wrap: wrap; justify-content: center; gap: 6px 16px; padding: 10px 0 0 !important; margin: 0; border-top: 1px solid rgba(255,255,255,0.06); }
      .nav-links a { font-size: 12px; letter-spacing: 0.5px; }
      .nav-links a.nav-cta { padding: 6px 12px; }
      footer { flex-wrap: wrap; justify-content: center; gap: 12px; padding: 24px 16px !important; text-align: center; }
      .footer-links { flex-wrap: wrap; justify-content: center; gap: 8px 16px; padding: 0; margin: 0; }
      .page { padding: 116px 16px 56px; }
      .grid { grid-template-columns: 1fr; }
      .article-title { font-size: 28px; }
    }
  </style>

<script>
var API = (location.hostname==='localhost'||location.hostname==='127.0.0.1') ? 'http://localhost:5001' : 'https://nqmtayofbhletydmiujz.supabase.co/functions/v1/wave-data';
var FEATURED_RESEARCH_CARD = "<a class=\"research-feature\" href=\"research/three-portfolios.html\" aria-label=\"למחקר: שלוש הקצאות, שלוש פשרות\"><div class=\"research-feature__image\"><img src=\"assets/research/three-portfolios-banner.webp\" alt=\"שלושה מסלולים בכחול וכסף — איור קונספטואלי של פשרות בהקצאת נכסים\" width=\"1672\" height=\"941\" fetchpriority=\"high\"><span class=\"research-feature__number\">RESEARCH 001</span></div><div class=\"research-feature__body\"><span class=\"research-feature__eyebrow\">הקצאת נכסים · מחקר אמפירי</span><h2>שלוש הקצאות,<br>שלוש פשרות</h2><p>איך שילוב Nasdaq-100 או זהב משנה את צמיחת ההון, הסיכון וההתאוששות של תיק S&amp;P 500?</p><div class=\"research-feature__allocations\"><span><b>A</b> · 100% S&amp;P 500</span><span><b>B</b> · 50% S&amp;P 500 + 50% Nasdaq-100</span><span><b>C</b> · 70% S&amp;P 500 + 30% זהב</span></div><div class=\"research-feature__meta\"><span>2004–2026</span><span>5,518 תשואות יומיות</span><span>Wave Capital Research</span></div><span class=\"research-feature__cta\">למחקר המלא <b aria-hidden=\"true\">←</b></span><div class=\"research-cover-caption\">הבאנר הוא איור קונספטואלי; הגרפים והנתונים מופיעים במחקר.</div></div></a>";
var PAGE_SIZE = 12;
var _offset = 0;
var _total = 0;

function catColor(cat){
  return {MACRO:'#f59e0b',MARKETS:'#4a9eff',EARNINGS:'#22c55e',CRYPTO:'#a78bfa',GEO:'#fb923c',TECH:'#38bdf8',ENERGY:'#f59e0b'}[cat]||'#4a9eff';
}

function timeAgo(iso){
  try{
    var d = new Date(iso), diffMin = Math.floor((Date.now()-d.getTime())/60000);
    if(diffMin < 60) return diffMin+'m';
    if(diffMin < 1440) return Math.floor(diffMin/60)+'h';
    return d.toLocaleDateString(getLang()==='he'?'he-IL':'en-US', {month:'short', day:'numeric', year:'numeric'});
  }catch(e){ return ''; }
}

function cardHtml(a){
  var imgHtml = a.image_url
    ? '<img class="card-img" src="'+a.image_url+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
    : '';
  return '<a class="card" href="blog.html?id='+a.id+'" onclick="event.preventDefault();openArticle('+a.id+')">'
    +imgHtml
    +'<div class="card-body">'
    +'<span class="card-cat" style="color:'+catColor(a.category)+'">'+(a.category||'MARKETS')+'</span>'
    +'<div class="card-title">'+a.title+'</div>'
    +(a.lead?'<div class="card-lead">'+a.lead+'</div>':'')
    +'<div class="card-meta">'+(a.source||'')+' · '+timeAgo(a.created_at)+'</div>'
    +'</div></a>';
}

function renderMarkdownLite(body){
  return (body||'')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n\n/g,'</p><p>');
}

async function loadList(reset){
  if(reset){ _offset = 0; }
  var page = document.getElementById('page');
  if(reset){
    page.innerHTML =
      '<div class="page-tag" data-i18n="blog.tag">Research & Insights</div>'
      +'<h1 class="page-title" data-i18n="blog.title">Blog</h1>'
      +'<p class="page-sub" data-i18n="blog.sub">Market analysis, strategy breakdowns, and trade recaps.</p>'
      +FEATURED_RESEARCH_CARD
      +'<div id="curatedResearch" class="grid" style="margin-bottom:24px"></div>'
      +'<h2 class="research-archive-title" data-i18n="blog.archive">מאמרים וניתוחי שוק</h2>'
      +'<div id="blogGrid" class="grid"><div class="empty" data-i18n="blog.loading">Loading articles…</div></div>'
      +'<div class="loadmore-wrap" id="loadmoreWrap" style="display:none"><button class="loadmore" id="loadmoreBtn" data-i18n="blog.readMore">Load more</button></div>';
    document.getElementById('curatedResearch').innerHTML = (window.WaveResearchArticles||[]).map(function(a){return '<a class="card" href="blog.html?id='+encodeURIComponent(a.id)+'"><div class="card-body"><span class="card-cat">'+a.category+'</span><h2 class="card-title">'+a.title+'</h2><p class="card-lead">'+a.lead+'</p><div class="card-meta">'+a.source+' · '+timeAgo(a.created_at)+'</div></div></a>';}).join('');
    document.getElementById('loadmoreBtn').onclick = function(){ loadList(false); };
  }
  try{
    var r = await fetch(API+'/api/blog/articles?limit='+PAGE_SIZE+'&offset='+_offset);
    var d = await r.json();
    _total = d.total||0;
    _offset += (d.articles||[]).length;
    var grid = document.getElementById('blogGrid');
    if(reset) grid.innerHTML = '';
    if(!d.articles || !d.articles.length){
      if(reset) grid.innerHTML = '<div class="empty" data-i18n="blog.empty">No articles yet — check back soon.</div>';
    } else {
      grid.innerHTML += d.articles.map(cardHtml).join('');
    }
    var wrap = document.getElementById('loadmoreWrap');
    wrap.style.display = (_offset < _total) ? 'block' : 'none';
    applyLang();
  }catch(e){
    document.getElementById('blogGrid').innerHTML = '<div class="empty">'+(getLang()==='he'?'מאמרי השוק אינם זמינים כרגע. המחקר המלא למעלה זמין לקריאה.':'Market articles are unavailable. The full research above remains available.')+'</div>';
  }
}

async function openArticle(id){
  history.pushState({id:id}, '', 'blog.html?id='+id);
  var page = document.getElementById('page');
  page.innerHTML = '<div class="empty" data-i18n="blog.loading">Loading articles…</div>';
  applyLang();
  try{
    var a = (window.WaveResearchArticles||[]).find(function(item){return item.id===String(id);});
    var curatedArticle=!!a;
    if(!a){var r = await fetch(API+'/api/blog/article/'+encodeURIComponent(id)); a = await r.json();}
    if(a.error){ page.innerHTML = '<div class="empty">'+a.error+'</div>'; return; }
    var heroHtml = a.image_url
      ? '<img class="article-hero" src="'+a.image_url+'" alt="" onerror="this.style.display=\'none\'">'
      : '';
    page.innerHTML =
      '<a class="back-link" href="blog.html" onclick="event.preventDefault();backToList()">&larr; <span data-i18n="blog.back">Back to Blog</span></a>'
      +heroHtml
      +'<span class="article-cat" style="color:'+catColor(a.category)+'">'+(a.category||'MARKETS')+'</span>'
      +'<h1 class="article-title">'+a.title+'</h1>'
      +'<div class="article-meta"><span>'+(a.source||'')+'</span><span>·</span><span>'+timeAgo(a.created_at)+'</span></div>'
      +'<button class="article-save" id="articleSaveBtn" type="button">☆ Save to Account</button>'
      +(a.lead?'<div class="article-lead">'+a.lead+'</div>':'')
      +(curatedArticle && window.WaveHoodResearch ? window.WaveHoodResearch.html() : '<div class="article-body"><p>'+renderMarkdownLite(a.body)+'</p></div>')
      +(a.link?'<div class="article-source"><span data-i18n="blog.source">Source</span>: <a href="'+a.link+'" target="_blank" rel="noopener">'+(a.source||a.link)+'</a></div>':'');
    if(curatedArticle && window.WaveHoodResearch) window.WaveHoodResearch.mount();
    if(window.wireArticleSave) wireArticleSave(a);
    if(window.WaveSearch) WaveSearch.rebuild();
    applyLang();
    window.scrollTo(0,0);
  }catch(e){
    page.innerHTML = '<div class="empty">Failed to load article: '+e.message+'</div>';
  }
}

function openResearchSources(){
  document.getElementById('page').innerHTML='<section id="page-sources"><a class="back-link" href="blog.html">חזרה למחקרים</a><h1 class="page-title">מקורות ומתודולוגיה</h1><div id="sourcesContent"></div></section>';
  if(window.WaveSources) WaveSources.render();
}
function backToList(){
  history.pushState({}, '', 'blog.html');
  loadList(true);
}

window.addEventListener('popstate', function(){
  var id = new URLSearchParams(location.search).get('id');
  if(new URLSearchParams(location.search).get('view')==='sources') openResearchSources(); else if(id) openArticle(id); else loadList(true);
});

(function(){
  var id = new URLSearchParams(location.search).get('id');
  if(id) openArticle(id); else loadList(true);
})();
</script>
