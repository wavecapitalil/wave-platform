    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }

    .article-title { font-size: 38px; font-weight: 900; line-height: 1.2; margin-bottom: 18px; max-width: 820px; }
    .article-meta { font-size: 13px; color: #666; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
    .article-save { margin: 0 0 28px; background: rgba(85,170,255,.07); border: 1px solid rgba(85,170,255,.28); color: #9bd1ff; border-radius: 9px; padding: 9px 13px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .article-save:hover { background: rgba(85,170,255,.13); border-color: #55aaff; }

    html[dir="rtl"] .nav-links { padding-left: 0; padding-right: 12px; }
    html[dir="rtl"] .nav-lang { margin-left: 0; margin-right: auto; }
    html[dir="rtl"] .back-link { flex-direction: row-reverse; }
    /* phones (13/10, yogiweb): the nav used to run off the screen; logo + language on top, links in a centred row below */
    @media (max-width: 760px) {
      .nav { flex-wrap: wrap; row-gap: 8px; padding: 12px 16px 10px; }
      .nav-links { order: 5; width: 100%; flex-wrap: wrap; justify-content: center; gap: 6px 16px; padding: 10px 0 0 !important; margin: 0; border-top: 1px solid rgba(255,255,255,0.06); }

      footer { flex-wrap: wrap; justify-content: center; gap: 12px; padding: 24px 16px !important; text-align: center; }

      .page { padding: 116px 16px 56px; }
      .grid { grid-template-columns: 1fr; }
      .article-title { font-size: 28px; }
    }
  .research-ticker-cover{display:grid;place-items:center;aspect-ratio:1;background:linear-gradient(145deg,#172b43,#0b121d);color:#e9eff7;font-size:42px;font-weight:700;letter-spacing:4px}.research-index-card{max-width:280px;width:100%;direction:rtl}.research-index-card .card-img{width:100%;height:auto;aspect-ratio:1;object-fit:cover}.research-card-cta{display:inline-block;font-size:12px;padding:6px 12px;border:1px solid #38577d;border-radius:7px;color:#9bcaff;margin-top:12px}.research-filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px;direction:rtl}.research-filters button{padding:8px 16px;border:1px solid #283a50;border-radius:8px;background:#111a2b;color:#e9eff7;cursor:pointer}.research-filters button[aria-pressed=true]{background:#21416b;border-color:#4a9eff}[hidden]{display:none!important}.research-index-grid{margin-bottom:24px}#curatedResearch{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),280px));gap:24px;align-items:start}

  #curatedResearch{align-items:stretch}.research-index-card{display:flex;flex-direction:column}.research-index-card .card-img{flex:none}.research-index-card .card-body{box-sizing:border-box;height:264px;display:flex;flex-direction:column;align-items:stretch}.research-index-card .card-title{margin:0 0 10px}.research-index-card .card-lead:empty{display:none}.research-index-card .card-meta{margin-top:auto}.research-index-card .research-card-cta{align-self:flex-start;margin-top:auto}.research-index-card .card-meta+.research-card-cta{margin-top:12px}
</style>

<script>
var API = (location.hostname==='localhost'||location.hostname==='127.0.0.1') ? 'http://localhost:5001' : 'https://nqmtayofbhletydmiujz.supabase.co/functions/v1/wave-data';
var FEATURED_RESEARCH_CARD = '<a class="card research-index-card" data-tags="stocks commodities" href="research/three-portfolios.html"><img class="card-img" src="assets/research/three-portfolios-vs-banner.jpg" alt="S&amp;P 500, Nasdaq-100 וזהב"><div class="card-body"><h2 class="card-title">שלושה תיקים, שלוש דרכים להשקיע</h2><span class="research-card-cta">למאמר המלא</span></div></a>';
var researchFilter = new URLSearchParams(location.search).get('category') || 'all';
var articleTags = {'hood-2026-10-28':['stocks']};
function tagsFor(a){return articleTags[String(a.id)] || (Array.isArray(a.tags)?a.tags:({MACRO:['macro'],CRYPTO:['crypto'],EQUITY:['stocks'],'EQUITY RESEARCH':['stocks'],EARNINGS:['stocks'],ENERGY:['commodities'],COMMODITIES:['commodities']}[String(a.category||'').toUpperCase()]||[]));}
function filterArticles(category){
 researchFilter=category;
 var url=new URL(location.href); if(category==='all')url.searchParams.delete('category');else url.searchParams.set('category',category);history.replaceState({},'',url);
 var count=0;document.querySelectorAll('[data-tags]').forEach(function(card){var show=category==='all'||card.dataset.tags.split(' ').indexOf(category)!==-1;card.hidden=!show;if(show)count++;});
 document.querySelectorAll('[data-filter]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.filter===category));});
 var empty=document.getElementById('filterEmpty');if(empty){empty.hidden=count>0||category==='all';empty.textContent='אין כרגע מאמרים בקטגוריה שנבחרה.';}
}
var META_RESEARCH_CARD = '<a class="card research-index-card" data-tags="stocks" href="research/meta.html"><img class="card-img" src="assets/research/meta-cover.svg" alt="Meta — מחקר הרבעון השלישי של 2026" loading="lazy"><div class="card-body"><span class="card-cat">מניות · 22.10.2026</span><h2 class="card-title">אנליזה מטא — רבעון 3 FY2026</h2><span class="research-card-cta">למאמר המלא</span></div></a>';
var UBER_RESEARCH_CARD = '<a class="card research-index-card" data-tags="stocks" href="research/uber.html"><img class="card-img" src="assets/research/uber-cover.svg" alt="Uber — תחבורה ומשלוחים" loading="lazy"><div class="card-body"><span class="card-cat">מניות · 14.10.2026</span><h2 class="card-title">אנליזה אובר</h2><span class="research-card-cta">למאמר המלא</span></div></a>';
var SUI_RESEARCH_CARD = "<a class=\"card research-index-card\" data-tags=\"crypto\" href=\"research/sui.html\"><img class=\"card-img\" src=\"assets/research/sui-cover.svg\" alt=\"מחקר SUI, מחיר והכנסות\" loading=\"lazy\"><div class=\"card-body\"><span class=\"card-cat\">קריפטו · 3 בנובמבר 2026</span><h2 class=\"card-title\">SUI, מחיר והכנסות לאורך הזמן</h2><p class=\"card-lead\">מתאם ושיפוע בחלונות מתגלגלים, עם בדיקות לפי תנודתיות וכיוון המחיר.</p><span class=\"research-card-cta\">למחקר האינטראקטיבי</span></div></a>";
var PAGE_SIZE = 12;
var _offset = 0;
var _total = 0;

function catColor(cat){
  return {MACRO:'#f59e0b',MARKETS:'#4a9eff',EARNINGS:'#22c55e',CRYPTO:'#a78bfa',GEO:'#fb923c',TECH:'#38bdf8',ENERGY:'#f59e0b'}[cat]||'#4a9eff';
}

function timeAgo(iso){
  try{
    var d = new Date(iso), diffMin = Math.floor((Date.now()-d.getTime())/60000);
    if(diffMin < 60) return diffMin+'m';
    if(diffMin < 1440) return Math.floor(diffMin/60)+'h';
    return d.toLocaleDateString(getLang()==='he'?'he-IL':'en-US', {month:'short', day:'numeric', year:'numeric'});
  }catch(e){ return ''; }
}

function cardHtml(a){
  var imgHtml = a.image_url
    ? '<img class="card-img" src="'+a.image_url+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
    : '';
  return '<a class="card research-index-card" data-tags="'+tagsFor(a).join(' ')+'" href="blog.html?id='+a.id+'">'
    +imgHtml
    +'<div class="card-body">'
    +'<span class="card-cat" style="color:'+catColor(a.category)+'">'+(a.category||'MARKETS')+'</span>'
    +'<div class="card-title">'+a.title+'</div>'
    +(a.lead?'<div class="card-lead">'+a.lead+'</div>':'')
    +'<div class="card-meta">'+(a.source||'')+' · '+timeAgo(a.created_at)+'</div><span class="research-card-cta">למאמר המלא</span>'
    +'</div></a>';
}

function renderMarkdownLite(body){
  return (body||'')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\n\n/g,'</p><p>');
}

async function loadList(reset){
  if(reset){ _offset = 0; }
  var page = document.getElementById('page');
  if(reset){
    page.innerHTML =
      '<div class="page-tag" data-i18n="blog.tag">Research & Insights</div>'
      +'<h1 class="page-title" data-i18n="blog.title">Blog</h1>'
      +'<p class="page-sub" data-i18n="blog.sub">Market analysis, strategy breakdowns, and trade recaps.</p>'
      +'<div class="research-filters" aria-label="סינון מאמרים">'+[['all','הכול'],['macro','מאקרו'],['crypto','קריפטו'],['stocks','מניות'],['commodities','סחורות']].map(function(f){return '<button type="button" data-filter="'+f[0]+'" aria-pressed="false">'+f[1]+'</button>';}).join('')+'</div>'
      +'<div id="curatedResearch" class="grid" style="margin-bottom:24px"></div>'
      +'<p id="filterEmpty" role="status" hidden></p>'
      +'<div id="blogGrid" class="grid"><div class="empty" data-i18n="blog.loading">Loading articles…</div></div>'
      +'<div class="loadmore-wrap" id="loadmoreWrap" style="display:none"><button class="loadmore" id="loadmoreBtn" data-i18n="blog.readMore">Load more</button></div>';
    document.getElementById('curatedResearch').innerHTML = SUI_RESEARCH_CARD + FEATURED_RESEARCH_CARD + UBER_RESEARCH_CARD + META_RESEARCH_CARD + (window.WaveResearchArticles||[]).map(function(a){return '<a class="card research-index-card" data-tags="'+tagsFor(a).join(' ')+'" href="blog.html?id='+encodeURIComponent(a.id)+'"><img class="card-img" src="'+a.image_url+'" alt="'+(a.image_alt||'')+'" loading="lazy"><div class="card-body"><span class="card-cat">'+a.category+'</span><h2 class="card-title">'+a.title+'</h2><p class="card-lead">'+a.lead+'</p><div class="card-meta">'+a.source+' · '+timeAgo(a.created_at)+'</div><span class="research-card-cta">למאמר המלא</span></div></a>';}).join('');
    document.querySelectorAll('[data-filter]').forEach(function(b){b.onclick=function(){filterArticles(b.dataset.filter);};});filterArticles(researchFilter);
    document.getElementById('loadmoreBtn').onclick = function(){ loadList(false); };
  }
  try{
    var r = await fetch(API+'/api/blog/articles?limit='+PAGE_SIZE+'&offset='+_offset);
    var d = await r.json();
    if(reset){while((d.articles||[]).length < (d.total||0)){var next=await fetch(API+'/api/blog/articles?limit='+PAGE_SIZE+'&offset='+d.articles.length);var more=await next.json();if(!more.articles||!more.articles.length)break;d.articles=d.articles.concat(more.articles);}}
    if(!document.getElementById('blogGrid'))return;
    _total = d.total||0;
    _offset += (d.articles||[]).length;
    var grid = document.getElementById('blogGrid');
    if(reset) grid.innerHTML = '';
    if(!d.articles || !d.articles.length){
      if(reset) grid.innerHTML = '';
    } else {
      grid.innerHTML += d.articles.map(cardHtml).join('');
    }
    var wrap = document.getElementById('loadmoreWrap');
    wrap.style.display = (_offset < _total) ? 'block' : 'none';
    filterArticles(researchFilter);
    applyLang();
  }catch(e){
    document.getElementById('blogGrid').innerHTML = '<div class="empty">'+(getLang()==='he'?'מאמרי השוק אינם זמינים כרגע. המחקר המלא למעלה זמין לקריאה.':'Market articles are unavailable. The full research above remains available.')+'</div>';
  }
}

async function openArticle(id, fromHistory){
  if(!fromHistory) history.pushState({id:id}, '', 'blog.html?id='+id);
  var page = document.getElementById('page');
  page.innerHTML = '<div class="empty" data-i18n="blog.loading">Loading articles…</div>';
  applyLang();
  try{
    var a = (window.WaveResearchArticles||[]).find(function(item){return item.id===String(id);});
    var curatedArticle=!!a;
    if(!a){var r = await fetch(API+'/api/blog/article/'+encodeURIComponent(id)); a = await r.json();}
    if(a.error){ page.innerHTML = '<div class="empty">'+a.error+'</div>'; return; }
    var heroHtml = a.image_url
      ? '<img class="article-hero" src="'+a.image_url+'" alt="" onerror="this.style.display=\'none\'">'
      : '';
    page.innerHTML =
      '<a class="back-link" href="blog.html" onclick="event.preventDefault();backToList()">&larr; <span data-i18n="blog.back">Back to Blog</span></a>'
      +heroHtml
      +'<span class="article-cat" style="color:'+catColor(a.category)+'">'+(a.category||'MARKETS')+'</span>'
      +'<h1 class="article-title">'+a.title+'</h1>'
      +'<div class="article-meta"><span>'+(a.source||'')+'</span><span>·</span><span>'+timeAgo(a.created_at)+'</span></div>'
      +'<button class="article-save" id="articleSaveBtn" type="button">☆ Save to Account</button>'
      +(a.lead?'<div class="article-lead">'+a.lead+'</div>':'')
      +(curatedArticle && window.WaveHoodResearch ? window.WaveHoodResearch.html() : '<div class="article-body"><p>'+renderMarkdownLite(a.body)+'</p></div>')
      +(a.link?'<div class="article-source"><span data-i18n="blog.source">Source</span>: <a href="'+a.link+'" target="_blank" rel="noopener">'+(a.source||a.link)+'</a></div>':'');
    if(curatedArticle && window.WaveHoodResearch) window.WaveHoodResearch.mount();
    if(window.wireArticleSave) wireArticleSave(a);
    if(window.WaveSearch) WaveSearch.rebuild();
    applyLang();
    window.scrollTo(0,0);
  }catch(e){
    page.innerHTML = '<div class="empty">Failed to load article: '+e.message+'</div>';
  }
}

function openResearchSources(){
  document.getElementById('page').innerHTML='<section id="page-sources"><a class="back-link" href="blog.html">חזרה למחקרים</a><h1 class="page-title">מקורות ומתודולוגיה</h1><div id="sourcesContent"></div></section>';
  if(window.WaveSources) WaveSources.render();
}
function backToList(){
  history.pushState({}, '', 'blog.html');
  loadList(true);
}

window.addEventListener('popstate', function(){
  var id = new URLSearchParams(location.search).get('id');
  if(new URLSearchParams(location.search).get('view')==='sources') openResearchSources(); else if(id) openArticle(id,true); else loadList(true);
});

(function(){
  var id = new URLSearchParams(location.search).get('id');
  if(id) openArticle(id,true); else loadList(true);
