<script>const lessons=[["משפחת הדוג׳י (Doji)","איך נר יכול לנוע לאורך התקופה, ולסיים כמעט באותו מחיר שבו נפתח?","דוג׳י הוא נר שבו מחירי הפתיחה והסגירה קרובים מאוד. הגוף קטן, אבל הפתילים עשויים להעיד על תנועה משמעותית במהלך התקופה. משמעותו איננה 'אין פעילות', אלא שההפרש בין תחילת התקופה לסופה מצומצם.","דוג׳י רגיל, דוג׳י ארוך־רגליים, שפירית (Dragonfly) ואבן קבורה (Gravestone) נבדלים בעיקר במיקום הגוף ובאורך הפתילים. שם התבנית מתאר את המבנה, לא את כיוון הנר הבא.","אחרי עלייה חדה דוג׳י יכול להצביע על עצירה זמנית; אחרי ירידה חדה הוא יכול להופיע לפני תיקון או לפני המשך ירידה. בוחנים את הנרות שלפניו ואת תגובת המחיר לאחריו.","האם דוג׳י עם פתילים ארוכים מעיד בהכרח על שוק ללא תנודתיות?","לא. הוא יכול להיווצר לאחר תנועה רחבה לשני הכיוונים, גם כאשר הפתיחה והסגירה כמעט זהות."],["Spinning Top ו־Marubozu","שני נרות יכולים להיות שונים מאוד — גם כשהם מגיעים מאותו רצף מחיר.","סביבון (Spinning Top) מאופיין בגוף קטן ופתילים משני צידיו. הוא מתאר שינוי קטן יחסית בין פתיחה לסגירה בתוך טווח המסחר. לעומתו, Marubozu מציג גוף גדול מאוד ופתילים קצרים או חסרים.","Marubozu שורי אינו הבטחה להמשך עלייה; הוא מספר שבאותה תקופה הקונים הצליחו להוביל את המחיר מהפתיחה לסגירה. סביבון אינו בהכרח דוג׳י, מפני שהגוף שלו עשוי להיות מובחן יותר.","נר בעל גוף גדול נבחן גם ביחס לנרות שקדמו לו. אותו גוף יכול להיראות חריג לאחר התכנסות, ורגיל לגמרי בתקופה תנודתית.","מה ההבדל המרכזי בין סביבון לנר Marubozu?","בסביבון הגוף קטן ביחס לטווח ולצידיו פתילים; ב־Marubozu הגוף ממלא את רוב הטווח והפתילים מועטים או חסרים."],["Hammer ו־Hanging Man","אותה אנטומיה — שני שמות שונים בהתאם למיקום ברצף.","פטיש (Hammer) ואיש תלוי (Hanging Man) כוללים בדרך כלל גוף קטן בחלק העליון ופתיל תחתון ארוך. הנר יכול להיות ירוק או אדום; הצבע אינו מגדיר את שם התבנית.","כאשר המבנה מופיע לאחר ירידה מתמשכת, נכנה אותו פטיש. כאשר הוא מופיע לאחר עלייה, נכנה אותו איש תלוי. השם משקף הקשר היסטורי ולא תחזית מחייבת.","פתיל תחתון ארוך מראה שהמחיר נסחר נמוך יותר במהלך התקופה ולא נשאר שם עד הסגירה. אבל רק הנרות הבאים יראו אם זו הייתה תגובת נגד משמעותית.","האם נר אדום עם פתיל תחתון ארוך יכול להיות Hammer?","כן. אם המבנה מתאים והופיע אחרי ירידה, הוא עשוי להיחשב פטיש גם אם הסגירה מעט מתחת לפתיחה."],["Inverted Hammer ו־Shooting Star","צבע הגוף לא קובע את שם התבנית. ההקשר הוא שמבדיל בין השתיים.","לשתי התבניות גוף קטן סמוך לחלק התחתון של הנר ופתיל עליון ארוך. הפתיל מספר שהמחיר הגיע גבוה יותר במהלך התקופה, אבל לא שמר על כל העלייה עד הסגירה.","לאחר ירידה, המבנה מכונה פטיש הפוך (Inverted Hammer) — ירוק או אדום. לאחר עלייה, אותו מבנה מכונה כוכב נופל (Shooting Star) — ירוק או אדום. האנטומיה דומה; המגמה הקודמת היא שיוצרת את ההבחנה.","בכוכב נופל לאחר עלייה, הפתיל עשוי להעיד על קושי להחזיק במחיר הגבוה. בפטיש הפוך לאחר ירידה, הוא מתאר ניסיון עלייה במהלך התקופה. אין להסיק היפוך באופן אוטומטי מאף אחת מהתבניות.","אם מופיע נר ירוק עם פתיל עליון ארוך אחרי מגמת עלייה, האם הוא פטיש הפוך?","לא לפי המינוח המקובל: אם המבנה מתאים והנר מופיע אחרי עלייה, מדובר בכוכב נופל גם אם צבעו ירוק."],["תרגול זיהוי תבניות","מתארים קודם מה רואים — ורק אז בוחרים שם לתבנית.","בכל דוגמה נבחין בין הגוף, הפתילים, מיקום הנר בתוך הרצף והמגמה שקדמה לו. לעיתים התשובה המקצועית היא שאין מספיק מידע כדי לזהות תבנית מסוימת.","המטרה אינה לנחש את הנר הבא, אלא להוכיח שאתם מזהים את המבנה ומבדילים בין תיאור נצפה לפרשנות. נר קטן אינו בהכרח דוג׳י, ופתיל ארוך לבדו אינו מוכיח דחיית מחיר שתימשך.","התבניות יכולות להיכשל. גם זיהוי אנטומי מדויק אינו מחייב שהמחיר ינוע בהמשך כפי שציפינו.","אם ראיתם נר עם גוף קטן ופתיל עליון ארוך, בלי לראות את הנרות שלפניו — האם אפשר לקרוא לו כוכב נופל?","אפשר לתאר את מבנה הנר, אבל אי אפשר להכריע את שם התבנית בלי ההקשר של רצף המחיר."]];let index=0;const nav=document.getElementById('nav'),content=document.getElementById('content');function chart(type=0){let downward=[2,3,6,8].includes(type),a=downward?[155,151,147,149,143,138,135,137,129,125,128,123,119,117,114,111,113,109,105,108]:[100,104,109,106,112,118,115,120,124,122,130,134,131,139,144,141,148,145,151,149];let candles=a.map((c,i)=>{let o=(i?a[i-1]:(downward?158:97))+[.7,-.5,1.2,-1,.2][(i+type)%5];return {o,c,h:Math.max(o,c)+[1,3,2,5,2][(i+type)%5],l:Math.min(o,c)-[3,2,4,1,2][(i*2+type)%5]}});let z=candles[candles.length-1],last=a[a.length-1],red=type%2===1;if(type===2||type===3||type===7||type===9){z.o=red?last+1.4:last-1.4;z.c=red?last-1.4:last+1.4;z.h=last+16;z.l=last-3}else if(type===6||type===8){z.o=red?last+1.4:last-1.4;z.c=red?last-1.4:last+1.4;z.l=last-17;z.h=last+3}else if(type===0){z.o=last+.3;z.c=last-.3;z.h=last+8;z.l=last-8}else if(type===1){z.o=last-1;z.c=last+1;z.h=last+7;z.l=last-6}else if(type===4){z.o=last-3;z.c=last+9;z.h=z.c+.6;z.l=z.o-.8}else if(type===5){z.o=last+1;z.c=last-1;z.h=last+5;z.l=last-6}let lo=Math.min(...candles.map(x=>x.l))-3,hi=Math.max(...candles.map(x=>x.h))+3,y=v=>251-(v-lo)/(hi-lo)*220;let svg='<svg viewBox="0 0 540 275" role="img" aria-label="גרף נרות המחשה מקצועי עם כעשרים נרות ורצף תנועת מחיר"><rect width="540" height="275" rx="9" fill="#071a2e"/>';for(let j=0;j<6;j++)svg+='<path d="M12 '+(20+j*43)+'H525" stroke="#284660" opacity=".36"/>';candles.forEach((r,i)=>{let x=17+(i+.5)*24.5,col=r.c>=r.o?'#2bcea5':'#ef6b79',t=Math.min(y(r.o),y(r.c)),h=Math.max(3,Math.abs(y(r.o)-y(r.c)));if(i===candles.length-1)svg+='<rect x="'+(x-10)+'" y="11" width="20" height="244" fill="#236a9f" opacity=".17" rx="6"/>';svg+='<line x1="'+x+'" x2="'+x+'" y1="'+y(r.h)+'" y2="'+y(r.l)+'" stroke="'+col+'" stroke-width="2"/><rect x="'+(x-7)+'" y="'+t+'" width="14" height="'+h+'" fill="'+col+'" rx=".5"/>'});return svg+'</svg>'}function render(n){index=Math.max(0,Math.min(4,n));history.replaceState(null,'','?lesson='+(index+1));let x=lessons[index];nav.innerHTML=lessons.map((a,i)=>'<button data-i="'+i+'" class="'+(i===index?'active':'')+'">'+(i+1)+'. '+a[0]+'</button>').join('');document.getElementById('title').textContent='4.'+(index+1)+' — '+x[0];document.getElementById('intro').textContent=x[1];let types=index===3?[2,3,7,9]:index===2?[6,8]:[index*3+1];let grid=types.map((t,i)=>'<div class="chart"><h3>'+(index===3?['פטיש הפוך לאחר ירידה — ירוק','פטיש הפוך לאחר ירידה — אדום','כוכב נופל לאחר עלייה — ירוק','כוכב נופל לאחר עלייה — אדום'][i]:'התבנית בתוך רצף מחיר')+'</h3>'+chart(t)+'<div class="caption">המחשה לימודית מקורית — לא נתוני מסחר אמיתיים</div></div>').join('');content.innerHTML='<section class="section"><h2>מה רואים בשוק?</h2><p>'+x[2]+'</p><div class="chartlist">'+grid+'</div></section><section class="section"><h2>זיהוי התבנית</h2><p>'+x[3]+'</p></section><section class="section"><h2>למה ההקשר חשוב?</h2><p>'+x[4]+'</p></section><section class="section practice"><h2>בדיקת הבנה</h2><p>'+x[5]+'</p><button id="reveal">הצגת הפתרון וההסבר</button><div class="answer" id="answer">'+x[6]+'</div></section>';document.getElementById('reveal').onclick=()=>{let a=document.getElementById('answer');a.style.display=a.style.display==='block'?'none':'block'};nav.querySelectorAll('button').forEach(b=>b.onclick=()=>render(+b.dataset.i));document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===4;window.scrollTo(0,0)}document.getElementById('prev').onclick=()=>render(index-1);document.getElementById('next').onclick=()=>render(index+1);let q=Number(new URLSearchParams(location.search).get('lesson'));render(q>=1&&q<=5?q-1:0);</script><script src="wave-candles-unified-sidebar.js?v=20261108" defer></script></body></html>
