<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" role="img" aria-labelledby="gap-title gap-desc">
<title id="gap-title">פער פתיחה של שלוש יחידות לעומת פער מלא של יחידה וחצי</title>
<desc id="gap-desc">מחיר הסגירה של הנר הקודם 105, מחיר הפתיחה של הנר הבא 108. הגבוה של הנר הקודם 106 והנמוך של הנר הבא 107.5. פער הפתיחה הוא שלוש יחידות והפער המלא בין טווחי הנרות הוא יחידה וחצי.</desc>
<rect x="1" y="1" width="1158" height="518" rx="18" fill="#071d35" stroke="#335f82" stroke-width="2"/>
<g font-family="Arial,sans-serif"><text x="1100" y="49" fill="#edf8ff" font-size="32" text-anchor="end" direction="rtl" font-weight="700">פער פתיחה לעומת פער מלא</text><text x="1100" y="83" fill="#adcee7" font-size="20" text-anchor="end" direction="rtl">המחשה סינתטית המבוססת על ערכי הדוגמה בשיעור</text></g>
<g stroke="#254966" stroke-dasharray="5 7" stroke-width="1.3">
<path d="M88 111 H1015 M88 191 H1015 M88 231 H1015 M88 251 H1015 M88 271 H1015 M88 351 H1015"/>
</g>
<line x1="1024" y1="100" x2="1024" y2="365" stroke="#a4cce7" stroke-width="1.5"/>
<g fill="#d3eafa" font-size="17" font-family="Arial,sans-serif" text-anchor="start" direction="ltr">
<text x="1038" y="117">112</text><text x="1038" y="197">108</text><text x="1038" y="237">106</text><text x="1038" y="257">105</text><text x="1038" y="277">104</text><text x="1038" y="357">100</text>
</g>
<!-- scale: y = 351 - 20 * (price - 100); earlier high 106 -> 231; next low 107.5 -> 201 -->
<rect x="450" y="201" width="350" height="30" fill="#c5a15f" fill-opacity=".19" stroke="#dcb873" stroke-dasharray="5 4"/>
<text x="625" y="218" text-anchor="middle" fill="#ffe1a0" font-size="18" font-family="Arial,sans-serif" direction="rtl">פער מלא: 1.5</text>
<!-- prior candle: O103 H106 L101 C105 -->
<line x1="350" y1="231" x2="350" y2="331" stroke="#48d5a1" stroke-width="6" stroke-linecap="round"/>
<rect x="316" y="251" width="68" height="40" fill="#36c895" stroke="#90f8d2" stroke-width="1.8" rx="2"/>
<!-- next candle: O108 H112 L107.5 C110 -->
<line x1="865" y1="111" x2="865" y2="201" stroke="#48d5a1" stroke-width="6" stroke-linecap="round"/>
<rect x="831" y="151" width="68" height="40" fill="#36c895" stroke="#90f8d2" stroke-width="1.8" rx="2"/>
<!-- opening discontinuity: old C105 -> next O108 -->
<path d="M407 251 H435 M435 251 V191 M407 191 H435" stroke="#5fbdf7" stroke-width="3" fill="none"/>
<rect x="93" y="145" width="235" height="72" rx="10" fill="#103c60" stroke="#337ca9"/>
<text x="111" y="172" fill="#ccecff" font-family="Arial,sans-serif" direction="ltr" font-size="19">108 − 105 = 3</text>
<text x="111" y="199" fill="#ccecff" font-family="Arial,sans-serif" font-size="16" direction="rtl">פער בין סגירה לפתיחה</text>
<g font-family="Arial,sans-serif" font-size="18" fill="#b6d9ee" direction="ltr" text-anchor="middle">
<text x="350" y="399">Previous C = 105</text><text x="865" y="399">Next O = 108</text>
<text x="350" y="430">Previous H = 106</text><text x="865" y="430">Next L = 107.5</text>
</g>
<text x="1100" y="484" text-anchor="end" font-size="18" fill="#99c9e8" font-family="Arial,sans-serif" direction="rtl">השטח המסומן הוא רק האזור שבין 106 ל־107.5, ולא כל הפרש הפתיחה</text>
</svg>