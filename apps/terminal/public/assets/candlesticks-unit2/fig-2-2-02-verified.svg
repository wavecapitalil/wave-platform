<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">מדידה מדויקת של גוף, פתילים וטווח נר</title>
<desc id="desc">נר שורי עם פתיחה 100, גבוה 112, נמוך 96 וסגירה 108. אורך הגוף 8 יחידות, הפתיל העליון 4, הפתיל התחתון 4 והטווח המלא 16.</desc>
<rect x="1" y="1" width="1198" height="578" rx="22" fill="#071d34" stroke="#2e597a" stroke-width="2"/>
<text x="1140" y="64" text-anchor="end" direction="rtl" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#e8f4ff">מדידת גוף הנר והפתילים</text>
<text x="1120" y="100" text-anchor="end" direction="ltr" font-family="Arial, sans-serif" font-size="21" fill="#a7d1ed">O=100 · H=112 · L=96 · C=108</text>
<g stroke="#294a68" stroke-dasharray="5 8" stroke-width="1.5">
<line x1="55" y1="145" x2="1120" y2="145"/><line x1="55" y1="215" x2="1120" y2="215"/><line x1="55" y1="285" x2="1120" y2="285"/><line x1="55" y1="355" x2="1120" y2="355"/><line x1="55" y1="425" x2="1120" y2="425"/>
</g>
