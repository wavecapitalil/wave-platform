<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description"><title id="title">Inside Bar vs Outside Bar — השוואת טווחי נרות</title><desc id="description">משמאל Inside Bar: הטווח של הנר השני נמצא בתוך הגבוה והנמוך של הנר הראשון. מימין Outside Bar: הגבוה השני גבוה מהגבוה הראשון והנמוך השני נמוך מהנמוך הראשון. מחירים סינתטיים לצורכי הוראה.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#092640"/><stop offset="1" stop-color="#051526"/></linearGradient>
<linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#123858"/><stop offset="1" stop-color="#071b2f"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3eff8a"/><stop offset="1" stop-color="#06a861"/></linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff665f"/><stop offset="1" stop-color="#dc282b"/></linearGradient>
<filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><rect x="16" y="15" width="1568" height="866" rx="24" fill="none" stroke="#3f79a2" stroke-width="2"/>
<text x="800" y="79" fill="#f3f8ff" text-anchor="middle" font-family="Arial,sans-serif" font-size="57" font-weight="700">Inside Bar <tspan fill="#35dded">vs</tspan> Outside Bar</text>
<text x="800" y="126" fill="#b1d2ea" text-anchor="middle" font-family="Arial,sans-serif" font-size="29">השוואת טווחי High–Low בין שני נרות</text>
<rect x="39" y="168" width="750" height="699" rx="18" fill="url(#p)" stroke="#468cb5" stroke-width="2"/>
<rect x="811" y="168" width="750" height="699" rx="18" fill="url(#p)" stroke="#468cb5" stroke-width="2"/>
<text x="414" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" fill="#f0f7ff" font-weight="bold">Inside Bar — נר פנימי</text>
<text x="1186" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" fill="#f0f7ff" font-weight="bold">Outside Bar — נר חיצוני</text>
<path d="M40 251 H788 M812 251 H1560" stroke="#2c678d" stroke-width="2"/>
<g stroke="#234962" stroke-width="1.3" opacity=".8">
<path d="M75 310 H759 M75 388 H759 M75 466 H759 M75 544 H759 M75 622 H759 M840 310 H1518 M840 388 H1518 M840 466 H1518 M840 544 H1518 M840 622 H1518" stroke-dasharray="6 11"/>
</g>
<!-- left mother candle high 110 low 90; child high 106 low 94 -->
<g stroke="#ff655a" stroke-width="9" stroke-linecap="round"><path d="M340 311 V620"/></g>
<rect x="295" y="397" width="90" height="154" rx="5" fill="url(#red)" stroke="#ff9a8f" stroke-width="3"/>
<g stroke="#47ff8b" stroke-width="9" stroke-linecap="round"><path d="M514 373 V558"/></g>
<rect x="470" y="425" width="88" height="90" rx="5" fill="url(#green)" stroke="#8fffaa" stroke-width="3"/>
<!-- left mother range white, child cyan -->
<rect x="264" y="309" width="321" height="313" fill="none" stroke="#f2f6fb" stroke-width="3" stroke-dasharray="13 9"/>
<rect x="444" y="371" width="141" height="189" fill="none" stroke="#27e6e9" stroke-width="3" stroke-dasharray="12 8"/>
<path d="M155 310 H259 M155 621 H259" stroke="#e4eef8" stroke-width="3"/>
<text x="145" y="302" text-anchor="end" font-family="Arial,sans-serif" font-size="24" fill="#f3f7fc">High</text><text x="145" y="627" text-anchor="end" font-family="Arial,sans-serif" font-size="24" fill="#f3f7fc">Low</text>
<text x="327" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#d6eaf8">Mother Bar</text><text x="521" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#66ebd3">Inside Bar</text>
<!-- right first bar high 106 low 94; outside high 110 low 90 -->
<g stroke="#ff786a" stroke-width="9" stroke-linecap="round"><path d="M1110 373 V559"/></g>
<rect x="1065" y="429" width="90" height="86" rx="5" fill="url(#red)" stroke="#ffa196" stroke-width="3"/>
<g stroke="#46fe84" stroke-width="9" stroke-linecap="round"><path d="M1280 310 V620"/></g>
<rect x="1235" y="366" width="90" height="228" rx="5" fill="url(#green)" stroke="#a0ffb5" stroke-width="3"/>
<rect x="1037" y="372" width="143" height="189" fill="none" stroke="#f5f7fd" stroke-width="3" stroke-dasharray="12 8"/>
<rect x="1202" y="309" width="156" height="313" fill="none" stroke="#23eced" stroke-width="3" stroke-dasharray="12 8"/>
<text x="1109" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#d4e7f3">First Bar</text><text x="1280" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#66ebd3">Outside Bar</text>
<path d="M1465 309 V623" stroke="#d4e2ed" stroke-width="2"/><g font-size="20" font-family="Arial,sans-serif" fill="#c8d9e9"><text x="1480" y="315">110</text><text x="1480" y="393">105</text><text x="1480" y="471">100</text><text x="1480" y="549">95</text><text x="1480" y="627">90</text></g><text x="1480" y="287" font-family="Arial,sans-serif" font-size="19" fill="#c9e0ee">Price</text>
<rect x="65" y="724" width="700" height="112" rx="14" fill="#0c2e48" stroke="#397b9f" stroke-width="2"/>
<rect x="835" y="724" width="700" height="112" rx="14" fill="#0c2e48" stroke="#397b9f" stroke-width="2"/>
<text x="415" y="763" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#54e8f1" font-weight="bold">נר פנימי</text>
<text x="415" y="801" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#e5f0fa">הנר השני נמצא כולו בתוך טווח הנר הראשון</text>
<text x="1185" y="763" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#54e8f1" font-weight="bold">נר חיצוני</text>
<text x="1185" y="801" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#e5f0fa">הנר השני חורג מעל הגבוה ומתחת לנמוך הראשון</text>
</svg>