<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">אותו טווח מחירים — שלושה גופים שונים</title><desc id="d">שלושה נרות יפניים עם גבוה 110 ונמוך 90. נר ראשון דוג׳י בפתיחה וסגירה 100, נר שני שורי שנפתח 94 ונסגר 106, ונר שלישי דובי שנפתח 106 ונסגר 94.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0c2946"/><stop offset="1" stop-color="#061526"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28e7af"/><stop offset="1" stop-color="#0d987e"/></linearGradient><linearGradient id="r" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7e78"/><stop offset="1" stop-color="#bd3448"/></linearGradient></defs>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="518" rx="21" fill="none" stroke="#345875" stroke-width="2"/>
