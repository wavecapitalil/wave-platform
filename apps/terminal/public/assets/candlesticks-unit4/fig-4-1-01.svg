<g stroke="#274864" stroke-width="1.5" stroke-dasharray="5 9"><line x1="100" x2="1034" y1="110" y2="110"/><line x1="100" x2="1034" y1="165" y2="165"/><line x1="100" x2="1034" y1="220" y2="220"/><line x1="100" x2="1034" y1="275" y2="275"/><line x1="100" x2="1034" y1="330" y2="330"/></g>
<line x1="1034" x2="1034" y1="98" y2="344" stroke="#91bbd8" stroke-width="2"/>
<g font-family="Arial" fill="#b5d4ea" font-size="21" text-anchor="start"><text x="1052" y="117">110</text><text x="1052" y="172">105</text><text x="1052" y="227">100</text><text x="1052" y="282">95</text><text x="1052" y="337">90</text></g>
<g font-family="Arial" fill="#89b3d2" font-size="16"><text x="1094" y="370" text-anchor="middle">Price</text><text x="96" y="108" text-anchor="end">High</text><text x="96" y="338" text-anchor="end">Low</text></g>
