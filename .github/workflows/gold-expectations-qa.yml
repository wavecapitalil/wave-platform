name: Gold Expectations QA
on:
  pull_request:
    paths:
      - 'apps/terminal/public/terminal-gold-expectations.*'
      - 'apps/terminal/public/data/gold-expectations.json'
      - 'apps/terminal/public/terminal-metals.js'
      - 'apps/terminal/public/terminal_app.html'
      - 'scripts/gold_expectations*'
      - 'scripts/metals_ratio_browser_qa.py'
      - 'apps/terminal/public/terminal.css'
      - '.github/workflows/gold-expectations-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  survey-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schema and renderer
        run: |
          node --check apps/terminal/public/terminal-gold-expectations.js
          GOLD_DATA_FILE=apps/terminal/public/data/gold-expectations.json node scripts/gold_expectations_test.cjs
      - name: Install browser test tools
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Test desktop, iPad and phone
        run: |
          python scripts/gold_expectations_browser_qa.py
          python scripts/metals_ratio_browser_qa.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-expectations-browser-evidence
          path: gold_expectations_browser_qa/
          retention-days: 7
