name: Generate verified historical cache catalogue
on:
  push:
    branches: [codex/historical-price-cache]
    paths: ['.github/workflows/history-cache-catalog-once.yml']
permissions:
  contents: write
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/historical-price-cache
      - run: |
          python3 scripts/build-calculation-catalog.py
          test "$(git hash-object supabase/functions/wave-data/calculation-catalog.ts)" = 3f3040eada7bca32b92c981d112c8f298d4924ba
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/wave-data/calculation-catalog.ts
          git commit -m "Generate verified historical cache source catalogue"
          git push origin HEAD:codex/historical-price-cache
