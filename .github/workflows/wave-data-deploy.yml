name: Deploy wave-data

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/wave-data/**"
      - ".github/workflows/wave-data-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wave-data-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sector on-demand refresh tests
        run: node --experimental-strip-types --test scripts/sector_pulse_test.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy wave-data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy wave-data --project-ref nqmtayofbhletydmiujz --no-verify-jwt
