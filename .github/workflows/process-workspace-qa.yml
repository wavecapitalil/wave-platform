name: Process workspace checks
on:
  pull_request:
    paths:
      - 'apps/terminal/public/calculation-*'
      - 'apps/terminal/public/process-*'
      - 'supabase/functions/wave-data/**'
      - 'services/api/data_engine/**'
      - 'scripts/process*'
      - '.github/workflows/process-workspace-qa.yml'
permissions:
  contents: read
jobs:
  private-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          pip install -r services/api/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Contract, authorization and formula regressions
        run: node --test scripts/process-workspace.test.mjs scripts/calculation-access-link.test.mjs scripts/calculations.test.mjs scripts/forward_consensus_test.mjs
      - name: Runner failure and lineage regressions
        working-directory: services/api/data_engine
        run: python -m unittest -v test_process_manifest.py
      - name: Syntax and source-catalogue reproducibility
        run: |
          for f in apps/terminal/public/*.js; do node --check "$f"; done
          python -m py_compile services/api/data_engine/*.py scripts/process_workspace_browser_qa.py
          python scripts/build-calculation-catalog.py
          git diff --exit-code -- supabase/functions/wave-data/calculation-catalog.ts
      - name: Responsive private workspace against synthetic fixtures
        env:
          WAVE_PROCESS_QA_OUT: artifacts/process-workspace-qa
        run: python scripts/process_workspace_browser_qa.py
      - name: Upload synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: process-workspace-synthetic-qa
          path: artifacts/process-workspace-qa
          retention-days: 7
