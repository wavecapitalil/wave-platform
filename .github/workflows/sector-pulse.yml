name: Sector pulse

on:
  schedule:
    # Every 30 minutes from 13:11 through 21:41 UTC, weekdays.
    # Covers the NYSE cash session in both EST (14:30–21:00 UTC) and EDT
    # (13:30–20:00 UTC), including the 13:00 ET early close, and one pass
    # after the regular close. Outside this window the last session is kept.
    - cron: "11,41 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: wave-sector-pulse
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WAVE_SUPABASE_URL: https://nqmtayofbhletydmiujz.supabase.co
      WAVE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5WjaBtaWtb3q7EJ3ldUfXQ_rVKIrZZy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: pip install -r services/api/requirements.txt

      - name: Sector session unit tests
        working-directory: services/api/data_engine
        run: python -m unittest -v test_sectors.py

      - name: Refresh sector snapshot
        run: python services/api/data_engine/run.py --output artifacts/data_snapshots.json --only sectors:sp500 --force

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          RESP=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=wave-snapshot-ingest")
          TOKEN=$(echo "$RESP" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish sector snapshot
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: python services/api/data_engine/publish.py artifacts/data_snapshots.json --batch-size 25
