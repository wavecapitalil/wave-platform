<!doctype html><html lang="he" dir="rtl"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מגדיל איור נגיש</title><style>body{font-family:Arial,sans-serif;margin:20px;background:#f7f9fc}img{max-width:100%;height:auto;cursor:zoom-in}dialog{border:0;border-radius:12px;max-width:96vw;max-height:95vh}dialog img{max-width:92vw;max-height:83vh;object-fit:contain;cursor:default}button{padding:10px}p{color:#53616e}</style><main><h2 id="title">איור לימודי</h2><img id="thumb" alt="איור נרות" tabindex="0" role="button" aria-label="פתח הגדלה של האיור"><p>לחיצה על האיור מגדילה אותו. Escape סוגר.</p></main><dialog id="popup"><button id="close">סגור ×</button><img id="large" alt=""></dialog><script>
const params=new URLSearchParams(location.search);const src=params.get('src')||'../assets/fig-2-1-01.png';const cap=params.get('caption')||'איור מתוך הקורס';for(let id of ['thumb','large']){document.getElementById(id).src=src;document.getElementById(id).alt=cap}document.getElementById('title').textContent=cap;const d=document.getElementById('popup');const open=()=>d.showModal();document.getElementById('thumb').addEventListener('click',open);document.getElementById('thumb').addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();open()}});document.getElementById('close').addEventListener('click',()=>d.close());d.addEventListener('click',e=>{if(e.target===d)d.close()});
</script></html>
