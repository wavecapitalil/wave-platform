<!doctype html><html lang="he" dir="rtl"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>סדנת נרות אינטראקטיבית</title><style>body{margin:0;background:#f7f9fc;color:#1c2c3a;font:15px Arial,sans-serif;padding:12px}.wrap{max-width:850px;margin:auto;border:1px solid #dce4ed;background:#fff;border-radius:14px;padding:18px}button{background:#fff;color:#243747;border:1px solid #bdcbd9;border-radius:9px;padding:10px;margin:3px;cursor:pointer}button[aria-pressed=true]{background:#245d83;color:white}button:focus-visible{outline:3px solid #e4aa49}svg{width:100%;height:auto}p{min-height:48px;line-height:1.6}</style><div class="wrap"><h3>סדנת נרות — מה משתנה ומה לא?</h3><div id="buttons"><button data-mode="bull" aria-pressed="true">נר שורי</button><button data-mode="bear" aria-pressed="false">נר דובי</button><button data-mode="support" aria-pressed="false">תמיכה והתנגדות</button><button data-mode="colors" aria-pressed="false">הדגשת הצבעים</button></div><svg viewBox="0 0 810 310" role="img" aria-label="נרות יפניים עם אפשרות החלפה בין סביבות הסבר"><g id="scene"></g></svg><p id="desc" aria-live="polite"></p><small>גרף מדגים, לא נתוני מסחר אמיתיים. ירוק ואדום מסמנים נרות; צבעי האזור אינם המלצה למסחר.</small></div><script>
let mode='bull';const S=document.querySelector('#scene'),NS='http://www.w3.org/2000/svg';function el(tag,a){let n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));S.appendChild(n);return n}function text(x,y,v,color='#4c6379',size=13){let n=el('text',{x,y,fill:color,'font-size':size,'text-anchor':'middle'});n.textContent=v};function candle(x,o,h,l,c,w=26){let y=p=>270-(p-70)*5,col=c>=o?'#168866':'#D65360';el('line',{x1:x,x2:x,y1:y(h),y2:y(l),stroke:col,'stroke-width':3});el('rect',{x:x-w/2,y:Math.min(y(o),y(c)),width:w,height:Math.max(2,Math.abs(y(c)-y(o))),fill:col,rx:2})};function render(){S.replaceChildren();for(let p=75;p<=115;p+=5){let y=270-(p-70)*5;el('line',{x1:22,x2:756,y1:y,y2:y,stroke:'#e6edf3'});text(780,y+4,String(p),'#64748b',11)}if(mode==='bull'||mode==='bear'){let bullish=mode==='bull',o=bullish?84:107,c=bullish?107:84;candle(370,o,112,79,c,75);text(370,288,bullish?'Close מעל Open':'Close מתחת Open','#23465f',17);text(485,270-(112-70)*5,'High');text(485,270-(79-70)*5,'Low');text(265,270-(o-70)*5,'Open');text(265,270-(c-70)*5,'Close')}else{let candles=[[104,108,101,106],[106,109,98,99],[99,101,94,96],[96,98,85,88],[88,95,86,94],[94,105,93,103],[103,109,99,107],[107,111,99,100],[100,101,87,89],[89,96,85,94],[94,104,90,102],[102,107,98,105]];if(mode==='colors'){el('rect',{x:25,y:270-(88-70)*5,width:720,height:28,fill:'#168866','fill-opacity':.14});el('rect',{x:25,y:270-(108-70)*5,width:720,height:26,fill:'#D65360','fill-opacity':.12});el('rect',{x:510,y:88,width:110,height:126,fill:'#D4A347','fill-opacity':.14});}else{el('line',{x1:25,x2:745,y1:270-(88-70)*5,y2:270-(88-70)*5,stroke:'#168866','stroke-dasharray':'7 5','stroke-width':2});el('line',{x1:25,x2:745,y1:270-(108-70)*5,y2:270-(108-70)*5,stroke:'#D65360','stroke-dasharray':'7 5','stroke-width':2})}candles.forEach((c,i)=>candle(65+i*55,...c,22));text(350,297,'המחשה סכמטית של אזורי מחיר','',12)}document.querySelector('#desc').textContent={bull:'ארבעת המחירים של </script></html>
