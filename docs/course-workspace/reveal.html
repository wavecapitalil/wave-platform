<!doctype html><html lang="he" dir="rtl"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חשיפה הדרגתית — אותו גרף</title><style>body{font-family:Arial, sans-serif;background:#f7f9fc;color:#19283a;margin:0;padding:15px}.frame{max-width:820px;margin:auto;background:#fff;border:1px solid #dfe6ed;border-radius:15px;padding:18px}button{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:9px 13px;cursor:pointer;color:#1e293b;margin:3px}button[aria-pressed=true]{background:#176b9b;color:white}button:focus-visible{outline:3px solid #c99a34}.controls{display:flex;flex-wrap:wrap;gap:5px}svg{width:100%;height:auto}small{color:#586b7d}.hide{display:none}</style><div class="frame"><h3>אותו רצף נרות — שלוש חשיפות</h3><div class="controls"><button data-step="1" aria-pressed="true">1. נתח בעצמך</button><button data-step="2" aria-pressed="false">2. הצג רמז</button><button data-step="3" aria-pressed="false">3. חשוף המשך</button></div><div class="controls hide" id="outcomes"><button data-outcome="up" aria-pressed="true">תרחיש התאוששות</button><button data-outcome="down" aria-pressed="false">תרחיש המשך ירידה</button></div><svg id="plot" viewBox="0 0 800 320" role="img" aria-label="גרף נרות; בהתחלה העתיד מוסתר ולאחר מכן נחשף"><g id="chart"></g></svg><p id="explanation" aria-live="polite"></p><small>דוגמה סינתטית בלבד. הנרות הקודמים וקנה המידה אינם משתנים בין השלבים; התרחישים החלופיים אינם מתיימרים להיות ההיסטוריה של נכס אמיתי.</small></div><script>
const base=[ [98,101,96,99],[99,100,94,95],[95,97,91,92],[92,94,87,89],[89,90,84,86],[86,90,85,88],[88,91,86,90],[90,91,85,86],[86,88,82,84],[84,89,83,88],[88,92,86,90],[90,91,87,89] ];
const alternate={up:[[89,94,88,93],[93,98,92,97],[97,102,96,100],[100,103,99,101]],down:[[89,91,86,87],[87,89,82,83],[83,85,79,81],[81,84,77,79]]};let step=1,outcome='up';const NS='http://www.w3.org/2000/svg';let svg=document.querySelector('#chart');
function el(tag,attrs,parent=svg){let e=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
function priceY(p){return 263-(p-74)*5.0};function render(){svg.replaceChildren();for(let p=80;p<=110;p+=5){el('line',{x1:40,x2:740,y1:priceY(p),y2:priceY(p),stroke:'#dde5ee','stroke-width':1});let t=el('text',{x:754,y:priceY(p)+4,'font-size':13,fill:'#64748b'});t.textContent=p}const data=step===3?base.concat(alternate[outcome]):base;data.forEach(([o,h,l,c],i)=>{let x=56+i*42,col=c>=o?'#168866':'#D65360';el('line',{x1:x,x2:x,y1:priceY(h),y2:priceY(l),stroke:col,'stroke-width':2});el('rect',{x:x-10,y:Math.min(priceY(o),priceY(c)),width:20,height:Math.max(2,Math.abs(priceY(o)-priceY(c))),fill:col,rx:2})});if(step<3){el('rect',{x:552,y:24,width:183,height:243,fill:'#eef2f6',rx:5});let t=el('text',{x:640,y:143,'text-anchor':'middle','font-size':28,fill:'#7a8a9e'});t.textContent='?'}if(step>=2){el('rect',{x:40,y:priceY(82)-8,width:700,height:18,fill:'#168866','fill-opacity':.12});el('line',{x1:40,x2:740,y1:priceY(82),y2:priceY(82),stroke:'#168866','stroke-dasharray':'5 5','stroke-width':2})}document.querySelector('#outcomes').classList.toggle('hide',step!==3);document.querySelector('#explanation').textContent=step===1?'זיהוי עצמאי: מה ניתן ללמוד מהנרות שכבר הופיעו?':step===2?'רמז: נבחן את אזור השפל. אותם נרות בדיוק — נוספה רק שכבת הסבר.':outcome==='up'?'המשך אפשרי א׳: התאוששות. הנרות הישנים לא השתנו.':'המשך אפשרי ב׳: ירידה נוספת מאותה נקודת החלטה.'}
document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{step=+b.dataset.step;document.querySelectorAll('[data-step]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));document.querySelectorAll('[data-outcome]').forEach(b=>b.addEventListener('click',()=>{outcome=b.dataset.outcome;document.querySelectorAll('[data-outcome]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));render();
</script></html>
